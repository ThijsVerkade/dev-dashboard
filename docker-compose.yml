# Run the dashboard in a container while reusing your host's AWS SSO session,
# Claude usage data, cloned repos, and .env.local.
#
# Prereqs on the HOST (once): `aws sso login --profile <your-profile>` — the container
# reuses the cached session through the mounted ~/.aws. The in-app "Log in to AWS SSO"
# button does NOT work from inside the container (no host browser); log in on the host.
#
# Then: `docker compose up` -> http://localhost:3000
services:
  dashboard:
    build: .
    container_name: dev-dashboard
    ports:
      - "3000:3000"
    # Load your config/tokens; still works if the file is absent (Next also reads it
    # from the mounted source), so this won't hard-fail a first run.
    env_file:
      - path: .env.local
        required: false
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - HOME=/root
      # Reliable hot-reload for bind mounts on macOS/Windows.
      - WATCHPACK_POLLING=true
    volumes:
      # Live source for HMR; repos clone into ./repos and .env.local writes land on the host.
      - .:/app
      # Keep the container's Linux-built deps and build cache (shadow the host's).
      - /app/node_modules
      - /app/.next
      # Reuse the host AWS SSO cache/credentials (rw so the SDK can refresh tokens).
      - ${HOME}/.aws:/root/.aws:rw
      # Claude Activity panel runs ccusage against your host usage data.
      - ${HOME}/.claude:/root/.claude:ro
